<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adarsh AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      background: #ffffff;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 45px;
      height: 45px;
      background: rgba(255,255,255,.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 23px;
    }

    .header h1 {
      font-size: 20px;
    }

    .header p {
      font-size: 12px;
      opacity: .85;
      margin-top: 3px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
    }

    .message {
      display: flex;
      margin-bottom: 16px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .bot .bubble {
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      padding: 12px;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #d1d5db;
      outline: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: #2563eb;
    }

    button {
      border: none;
      cursor: pointer;
    }

    #sendBtn {
      width: 50px;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 20px;
    }

    #sendBtn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .typing {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .app {
        height: 100vh;
        border-radius: 0;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">🤖</div>
      <div>
        <h1>Adarsh AI</h1>
        <p>Powered by Groq AI</p>
      </div>
    </div>

    <div id="chat">
      <div class="message bot">
        <div class="bubble">
          Namaste! 👋 Main Adarsh AI hoon. Mujhse kuch bhi pooch sakte ho.
        </div>
      </div>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
      >

      <button id="sendBtn">➤</button>
    </div>

  </div>

<script>

  // ==========================================
  // APNI NEW GROQ API KEY YAHAN PASTE KARO
  // ==========================================

  const GROQ_API_KEY = "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";


  // Groq API
  const API_URL =
    "https://api.groq.com/openai/v1/chat/completions";


  // Model
  const MODEL = "openai/gpt-oss-120b";


  const chat = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");


  // Conversation memory
  const messages = [
    {
      role: "system",
      content:
        "You are a helpful AI assistant. Answer clearly and helpfully. If the user speaks Hindi or Hinglish, reply in Hindi or Hinglish."
    }
  ];


  function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }


  function showTyping() {

    const typing = document.createElement("div");

    typing.className = "typing";

    typing.id = "typing";

    typing.textContent = "AI is thinking...";

    chat.appendChild(typing);

    chat.scrollTop = chat.scrollHeight;
  }


  function hideTyping() {

    const typing = document.getElementById("typing");

    if (typing) {
      typing.remove();
    }
  }


  async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;


    if (
      !GROQ_API_KEY ||
      GROQ_API_KEY === "PASTE_NEW_GROQ_API_KEY_HERE"
    ) {

      addMessage(
        "⚠️ Pehle code me apni new Groq API key add karo.",
        "bot"
      );

      return;
    }


    addMessage(text, "user");

    input.value = "";

    sendBtn.disabled = true;

    showTyping();


    messages.push({
      role: "user",
      content: text
    });


    try {

      const response = await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + GROQ_API_KEY
        },

        body: JSON.stringify({

          model: MODEL,

          messages: messages,

          temperature: 0.7,

          max_tokens: 1024

        })

      });


      const data = await response.json();


      hideTyping();


      if (!response.ok) {

        console.error(data);

        addMessage(
          "❌ API Error: " +
          (data.error?.message || "Something went wrong."),
          "bot"
        );

        return;
      }


      const reply =
        data.choices?.[0]?.message?.content ||
        "Sorry, mujhe response nahi mila.";


      messages.push({
        role: "assistant",
        content: reply
      });


      addMessage(reply, "bot");


    } catch (error) {

      hideTyping();

      console.error(error);

      addMessage(
        "❌ Network/API error. Internet connection aur API key check karo.",
        "bot"
      );

    } finally {

      sendBtn.disabled = false;

      input.focus();

    }

  }


  sendBtn.addEventListener("click", sendMessage);


  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  });

</script>

</body>
</html>
